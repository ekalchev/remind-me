modules:
  trigger:
    - key: remindme-on-comment
      function: on-comment
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
    - key: remindme-on-comment-deleted
      function: on-comment-deleted
      events:
        - avi:jira:deleted:comment
      filter:
        ignoreSelf: true
  scheduledTrigger:
    - key: remindme-deliver-due
      function: deliver-due
      interval: fiveMinute
  rovo:agent:
    - key: remindme-agent
      name: Remind Me
      description: Sets email reminders about the Jira issue you are viewing.
      prompt: |
        You are Remind Me. You set, list and cancel email reminders about the Jira issue the user is viewing. A reminder is always for the user you are talking to.

        When the user asks to be reminded, call the set-reminder action:
        - "when": the time in short English words, in the user's own time zone. Never convert it to UTC. Use forms such as "in 20 minutes", "in 2 hours", "in 3 days", "tomorrow 9am", "Friday 14:00", "next monday", "Oct 30 5pm" or "2026-10-30 17:00". Translate other languages to these forms. If the user gives no time, use "in 1 day". If the time is vague ("later", "soon") or depends on an event without a date ("when the build is green"), ask the user for a time instead of guessing.
        - "note": a short phrase, under 100 characters, saying what to remind them about, from their request and the issue (for example "Check whether Sam replied about the QA build").

        When the user asks what reminders they have, call list-reminders. When they ask to cancel, call cancel-reminder; pass "number" only when they name one from the list, and confirm with the user before cancelling all of them.

        Report the result in one or two short sentences, keeping the exact time and date the action returns. If an action says no issue is open, tell the user to open the issue first. Never claim a reminder is set unless the action said so.
      conversationStarters:
        - Remind me tomorrow morning about this issue
        - Which reminders do I have here?
        - Cancel my reminders on this issue
      actions:
        - set-reminder
        - list-reminders
        - cancel-reminder
  action:
    - key: set-reminder
      name: Set reminder
      function: rovo-set-reminder
      actionVerb: CREATE
      description: Set an email reminder for the current user about the Jira issue they are viewing, at a time they give.
      inputs:
        when:
          title: When
          type: string
          required: true
          description: The time in short English words in the user's time zone, such as "in 2 hours", "tomorrow 9am", "Friday 14:00" or "2026-10-30 17:00".
        note:
          title: Note
          type: string
          required: false
          description: A short phrase saying what to remind the user about.
    - key: list-reminders
      name: List reminders
      function: rovo-list-reminders
      actionVerb: GET
      description: List the current user's pending reminders on the Jira issue they are viewing, numbered.
    - key: cancel-reminder
      name: Cancel reminder
      function: rovo-cancel-reminder
      actionVerb: DELETE
      description: Cancel the current user's pending reminders on the Jira issue they are viewing, all of them or one by its number from the list.
      inputs:
        number:
          title: Number
          type: integer
          required: false
          description: The reminder's number from the list. Leave empty to cancel all of them.
  function:
    - key: rovo-set-reminder
      handler: index.setReminderAction
    - key: rovo-list-reminders
      handler: index.listRemindersAction
    - key: rovo-cancel-reminder
      handler: index.cancelReminderAction
    - key: on-comment
      handler: index.onComment
    - key: on-comment-deleted
      handler: index.onCommentDeleted
    - key: deliver-due
      handler: index.deliverDue
      # src/handlers/deliver.ts stops claiming work after RUN_BUDGET_MS (100 s).
      timeoutSeconds: 120
app:
  id: ari:cloud:ecosystem::app/89f65791-b0c5-4a8f-a270-91fd951377f7
  runtime:
    name: nodejs22.x
  storage:
    entities:
      - name: reminder
        attributes:
          id:
            type: string
          issueId:
            type: string
          issueKey:
            type: string
          commentId:
            type: string
          accountId:
            type: string
          dueAt:
            type: float
          note:
            type: string
          createdAt:
            type: float
          sentAt:
            type: float
          status:
            type: string
          attempts:
            type: integer
          lastError:
            type: string
          leaseUntil:
            type: float
          version:
            type: integer
          zone:
            type: string
          locale:
            type: string
          confirmationCommentId:
            type: string
        indexes:
          - name: by-status-due
            partition:
              - status
            range:
              - dueAt
          - name: by-issue-owner
            partition:
              - issueId
              - accountId
              - status
            range:
              - dueAt
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
