modules:
  trigger:
    - key: remindme-on-comment
      function: on-comment
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
    - key: remindme-on-comment-deleted
      function: on-comment-deleted
      events:
        - avi:jira:deleted:comment
      filter:
        ignoreSelf: true
  scheduledTrigger:
    - key: remindme-deliver-due
      function: deliver-due
      interval: fiveMinute
  llm:
    - key: remindme-llm
      model:
        - claude
  function:
    - key: on-comment
      handler: index.onComment
    - key: on-comment-deleted
      handler: index.onCommentDeleted
    - key: deliver-due
      handler: index.deliverDue
      # src/handlers/deliver.ts stops claiming work after RUN_BUDGET_MS (100 s).
      timeoutSeconds: 120
app:
  id: ari:cloud:ecosystem::app/89f65791-b0c5-4a8f-a270-91fd951377f7
  runtime:
    name: nodejs22.x
  storage:
    entities:
      - name: reminder
        attributes:
          id:
            type: string
          issueId:
            type: string
          issueKey:
            type: string
          commentId:
            type: string
          accountId:
            type: string
          dueAt:
            type: float
          note:
            type: string
          createdAt:
            type: float
          sentAt:
            type: float
          status:
            type: string
          attempts:
            type: integer
          lastError:
            type: string
          leaseUntil:
            type: float
          version:
            type: integer
          zone:
            type: string
          locale:
            type: string
          confirmationCommentId:
            type: string
        indexes:
          - name: by-status-due
            partition:
              - status
            range:
              - dueAt
          - name: by-issue-owner
            partition:
              - issueId
              - accountId
              - status
            range:
              - dueAt
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
